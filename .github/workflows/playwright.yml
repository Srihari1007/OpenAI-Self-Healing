name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npm run typecheck

      - run: npm run lint

      - name: Run initial Playwright pipeline
        id: initial_tests
        run: npx playwright test tests/pipeline-demo.spec.ts --project=chromium --workers=1

      - name: Upload self-healing input for manual review
        if: always() && steps.initial_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-input
          path: |
            artifacts/ai-resolution.md
            artifacts/defect-report.md
            screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
