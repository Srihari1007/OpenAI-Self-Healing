name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npm run typecheck

      - run: npm run lint

      - name: Run initial Playwright pipeline
        id: initial_tests
        continue-on-error: true
        run: |
          node scripts/reset-demo-state.mjs
          npx playwright test tests/pipeline-demo.spec.ts --project=chromium --workers=1

      - name: Run self-healing agent
        if: steps.initial_tests.outcome == 'failure'
        run: npm run self-heal:agent

      - name: Upload AI Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reports
          path: artifacts/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
