name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Playwright Tests
        id: playwright
        run: npm test
        continue-on-error: true

      - name: Generate AI Resolution Report
        if: always()
        run: npm run demo:self-heal

      - name: Upload AI Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reports
          path: artifacts/
          retention-days: 14

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Mark Pipeline Failed For Review
        if: always()
        run: |
          echo "Playwright failures detected."
          echo "AI reports generated."
          echo "Developer review required."
          exit 1
